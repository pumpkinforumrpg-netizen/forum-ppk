<div class="ppk-posting-preview-inner ppk-privmsg-preview f2 glass">
  <div class="ppk-posting-preview-title">{L_PREVIEW}</div>

  <div class="ppk-posting-preview-meta">
    <span class="ppk-posting-preview-label">{L_FROM}</span>
    <span class="ppk-posting-preview-author no-glyph-replace">{MESSAGE_FROM}</span>
    <span class="ppk-posting-preview-label">{L_TO}</span>
    <span class="ppk-posting-preview-recipient no-glyph-replace">{MESSAGE_TO}</span>
    <span class="ppk-posting-preview-date">{POST_DATE}</span>
  </div>

  <div class="ppk-posting-preview-subject">{POST_SUBJECT}</div>

  <div class="ppk-posting-preview-content">
    {MESSAGE_NEW}
  </div>
</div>
