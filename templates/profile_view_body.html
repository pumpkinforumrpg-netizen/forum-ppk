<!-- POUR RECUPERER LA COULEUR DU GROUPE ET LA METTRE SUR LES LIENS -->
<script>
function applyGroupColor() {
  $('.ppk-post, .ppk-profil').each(function () {
    const $bloc = $(this);
    const $name = $bloc.find('.nameprofil').first();

    if (!$name.length) return;

    const $source =
      $name.find('[style*="color"], font[color], a[style*="color"], span[style*="color"]').last().length
        ? $name.find('[style*="color"], font[color], a[style*="color"], span[style*="color"]').last()
        : ($name.find('a, font, span, strong, b').last().length
            ? $name.find('a, font, span, strong, b').last()
            : $name);

    const el = $source[0];

    const color =
      el.style.color ||
      el.getAttribute('color') ||
      window.getComputedStyle(el).color;

    if (color) {
      this.style.setProperty('--pseudo-color', color);
    }
  });
}

$(window).on('load pageshow', function () {
  applyGroupColor();

  requestAnimationFrame(function () {
    applyGroupColor();
  });

  setTimeout(function () {
    applyGroupColor();
  }, 100);
});
</script>

<!-- POUR LES BADGES FANTOMES -->
<script>
$(function () {
  const badges = {
    "ame errante": {
      img: "https://2img.net/i.imgur.com/0EvJOAI.png",
      desc: "Récemment inscrit(e)"
    },
    "nouvelle ame": {
      img: "https://2img.net/i.imgur.com/aG1VrGf.png",
      desc: "Récemment validé(e)"
    },
    "ame residente": {
      img: "https://2img.net/i.imgur.com/0jHWMMw.png",
      desc: "Là depuis 3 mois"
    },
    "hantise locale": {
      img: "https://2img.net/i.imgur.com/0pY04Kf.png",
      desc: "Là depuis 6 mois"
    },
    "fantome certifie": {
      img: "https://2img.net/i.imgur.com/Fe8GuQ5.png",
      desc: "Là depuis 1 an"
    },
    "oh l ancetre la": {
      img: "https://2img.net/i.imgur.com/EsDQUtL.png",
      desc: "Là depuis 2 ans"
    },
    "super ame": {
      img: "https://2img.net/i.imgur.com/H7F0Ezq.png",
      desc: "Point faible : trop fort."
    },
    "ame perdue": {
      img: "https://2img.net/i.imgur.com/RFURPD0.png",
      desc: "À compléter"
    }
  };

  function normalizeBadgeLabel(str) {
    return (str || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[’'`´-]/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  $("#rpg-badge").each(function () {
    const $badge = $(this);
    const label = $badge.text().trim();

    if (!label) return;

    const key = normalizeBadgeLabel(label);
    const badge = badges[key];

    if (!badge) {
      $badge[0].style.setProperty("--badge-icon", "none");
      $badge.removeAttr("data-badge-desc");
      return;
    }

    $badge[0].style.setProperty("--badge-icon", 'url("' + badge.img + '")');
    $badge.attr("data-badge-desc", badge.desc);
  });
});
</script>

<script>
$(function () {
  let mpFound = false;

  $(".liens-profil .un-link").each(function () {
    const $link = $(this);
    const id = $link.attr("id");

    $link.removeClass("fa-tip").removeAttr("data-tip");

    if (id === "field_id") {
      if (!mpFound) {
        mpFound = true;
        $link
          .addClass("fa-tip")
          .attr("data-tip", "MP");
      } else {
        $link.remove();
      }
    }

    else if (id === "field_id2") {
      $link
        .addClass("fa-tip")
        .attr("data-tip", "Lire la fiche");
    }

    else if (id === "field_id3") {
      $link
        .addClass("fa-tip")
        .attr("data-tip", "Voir les relations");
    }
  });
});
</script>
