<div class="ppk-posting-review-shell">

  <!-- BEGIN switch_inline_mode -->
  <div class="ppk-posting-review-title f2 glass">{L_TOPIC_REVIEW}</div>
  <!-- END switch_inline_mode -->

  <!-- BEGIN postrow -->
  <!-- BEGIN displayed -->
  <a name="{postrow.displayed.POST_ID}"></a>

  <div class="ppk-posting-review-item f2 glass {postrow.displayed.displayed.ROW_CLASS}">
    <div class="ppk-posting-review-head">
      <div class="ppk-posting-review-meta">
        <span class="ppk-posting-review-by">{postrow.displayed.L_TOPIC_BY}</span>
        <span class="ppk-posting-review-author no-glyph-replace">{postrow.displayed.POSTER_NAME}</span>
        <span class="ppk-posting-review-on">{postrow.displayed.L_TOPIC_ON}</span>
        <span class="ppk-posting-review-date">{postrow.displayed.POST_DATE}</span>
      </div>
    </div>

    <div class="ppk-posting-review-content">
      {postrow.displayed.MESSAGE}
    </div>
  </div>
  <!-- END displayed -->

  <!-- BEGIN hidden -->
  <div class="ppk-posting-review-hidden f2 glass">
    <p>{postrow.hidden.MESSAGE}</p>
  </div>
  <!-- END hidden -->
  <!-- END postrow -->

</div>
