  <script>
(function($) {
  const avatarCache = new Map();
  const guestAvatar = 'https://2img.net/u/4916/78/51/33/avatars/gallery/invite10.png';

  function absoluteUrl(href) {
    return new URL(href, window.location.origin).href;
  }

  async function getAvatarFromProfile(profileHref) {
    const url = absoluteUrl(profileHref);

    if (avatarCache.has(url)) {
      return avatarCache.get(url);
    }

    const promise = fetch(url, { credentials: 'same-origin' })
      .then(function(res) { return res.text(); })
      .then(function(html) {
        const doc = new DOMParser().parseFromString(html, 'text/html');

        const img = doc.querySelector(
          '.profil-avatar img, #profile-advanced-left .module img, #profile-advanced-right .module img, .avatar-field img, .profile_avatar img'
        );

        return img && img.src ? img.src : guestAvatar;
      })
      .catch(function() {
        return guestAvatar;
      });

    avatarCache.set(url, promise);
    return promise;
  }

  async function patchNotificationAvatar(notifEl) {
    const $notif = $(notifEl);
    const $slot = $notif.find('.notif_avatar').first();

    if (!$slot.length) return;
    if (.trim(slot.html()) !== '') return;

    const $profileLink = $notif.find('.notif_text a[href^="/u"]').first();

    if (!$profileLink.length) {
      $slot.html('<img src="' + guestAvatar + '" alt="">');
      return;
    }

    const src = await getAvatarFromProfile($profileLink.attr('href'));

    if (.trim(slot.html()) === '') {
      $slot.html('<img src="' + src + '" alt="">');
    }
  }

  function patchAllNotiffiAvatars() {
    $('#notiffi_panel .notification, .notification.alert').each(function() {
      patchNotificationAvatar(this);
    });
  }

  $(function() {
    patchAllNotiffiAvatars();

    const observer = new MutationObserver(function() {
      patchAllNotiffiAvatars();
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  });
})(jQuery);
</script>

<!-- SCRIPTS GLOW NIGHT REMPLACEMENTS DE LETTRES -->
<script>
(() => {
  const TARGET_FONT = "glow night";

  const DOUBLE_REPLACEMENTS_UPPER = [
    ["RE", ""],
    ["RO", ""],
    ["RA", ""],
    ["RU", ""],
    ["KE", ""],
    ["KO", ""],
    ["KA", ""],
    ["KU", ""]
  ];

  const DOUBLE_REPLACEMENTS_LOWER = [
    ["ri", ""],
    ["gi", ""],
    ["ct", ""],
    ["ft", ""]
  ];

  const SINGLE_REPLACEMENTS_UPPER = new Map([
    ["O", ""],
    ["P", ""],
    ["Q", ""],
    ["Y", ""],
    ["K", ""],
    ["B", ""],
    ["R", ""],
    ["C", ""]
  ]);

  const SINGLE_REPLACEMENTS_LOWER = new Map([
    ["i", ""],
    ["j", ""],
    ["k", ""],
    ["y", ""],
    ["z", ""]
  ]);

  const SKIP_TAGS = new Set([
    "SCRIPT",
    "STYLE",
    "NOSCRIPT",
    "TEXTAREA",
    "INPUT",
    "OPTION",
    "CODE",
    "PRE"
  ]);

  function applyUppercaseReplacements(text) {
    let result = text.toUpperCase();

    for (const [from, to] of DOUBLE_REPLACEMENTS_UPPER) {
      result = result.split(from).join(to);
    }

    result = Array.from(result, char => SINGLE_REPLACEMENTS_UPPER.get(char) || char).join("");
    return result;
  }

  function applyNormalReplacements(text) {
    let result = text;

    for (const [from, to] of DOUBLE_REPLACEMENTS_UPPER) {
      result = result.split(from).join(to);
    }

    for (const [from, to] of DOUBLE_REPLACEMENTS_LOWER) {
      result = result.split(from).join(to);
    }

    result = Array.from(result, char => {
      return SINGLE_REPLACEMENTS_UPPER.get(char)
        || SINGLE_REPLACEMENTS_LOWER.get(char)
        || char;
    }).join("");

    return result;
  }

  function hasGlowNight(el) {
    if (!el) return false;
    const fontFamily = window.getComputedStyle(el).fontFamily || "";
    return fontFamily.toLowerCase().includes(TARGET_FONT);
  }

  function isVisualUppercase(el) {
    if (!el) return false;
    return window.getComputedStyle(el).textTransform === "uppercase";
  }

  function shouldSkip(textNode) {
    const parent = textNode.parentElement;
    if (!parent) return true;
    if (SKIP_TAGS.has(parent.tagName)) return true;
    if (parent.isContentEditable) return true;
    if (parent.closest(".no-glyph-replace, [data-no-glyph-replace]")) return true;
    return false;
  }

  function processTextNode(textNode) {
    if (!textNode || textNode.nodeType !== Node.TEXT_NODE) return;
    if (shouldSkip(textNode)) return;

    const parent = textNode.parentElement;
    if (!hasGlowNight(parent)) return;

    const original = textNode.nodeValue;
    const transformed = isVisualUppercase(parent)
      ? applyUppercaseReplacements(original)
      : applyNormalReplacements(original);

    if (original !== transformed) {
      textNode.nodeValue = transformed;
    }
  }

  function processNode(root) {
    if (!root) return;

    if (root.nodeType === Node.TEXT_NODE) {
      processTextNode(root);
      return;
    }

    if (root.nodeType !== Node.ELEMENT_NODE && root.nodeType !== Node.DOCUMENT_FRAGMENT_NODE) {
      return;
    }

    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let current;
    while ((current = walker.nextNode())) {
      processTextNode(current);
    }
  }

  function init() {
    processNode(document.body);

    const observer = new MutationObserver((mutations) => {
      for (const mutation of mutations) {
        if (mutation.type === "childList") {
          mutation.addedNodes.forEach(processNode);
        }
      }
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>

<script>
(function() {
  var switchEl = document.getElementById("themeSwitch");
  if (!switchEl) return;

  var buttons = switchEl.querySelectorAll(".theme-btn");
  var thumb = switchEl.querySelector(".theme-thumb");

  function updateThumb(index) {
    if (!buttons.length || !thumb) return;
    var btnWidth = buttons[0].offsetWidth;
    thumb.style.transform = "translateX(" + (index * btnWidth) + "px)";
  }

  buttons.forEach(function(button, index) {
    button.addEventListener("click", function() {
      buttons.forEach(function(btn) {
        btn.classList.remove("active");
      });
      button.classList.add("active");
      updateThumb(index);
    });
  });

  updateThumb(0);
})();
</script>

  };

  function isValidTheme(theme) {
    return !!VALID_THEMES[theme];
  }

  function getSystemTheme() {
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
      ? "dark"
      : "light";
  }

  function getSavedTheme() {
    var saved = localStorage.getItem(STORAGE_KEY);

    if (!saved) {
      var legacy = localStorage.getItem(LEGACY_KEY);
      if (isValidTheme(legacy)) {
        saved = legacy;
        localStorage.setItem(STORAGE_KEY, legacy);
      }
    }

    return isValidTheme(saved) ? saved : null;
  }

  function getEffectiveTheme() {
    return getSavedTheme() || getSystemTheme();
  }

  function saveTheme(theme) {
    localStorage.setItem(STORAGE_KEY, theme);
    localStorage.setItem(LEGACY_KEY, theme);
  }

  function closestThemeButton(node, limit) {
    while (node && node !== limit) {
      if (
        node.classList &&
        node.classList.contains("theme-btn") &&
        node.getAttribute("data-theme")
      ) {
        return node;
      }
      node = node.parentNode;
    }
    return null;
  }

  function hasNewMessageState(img) {
    var container = img.closest
      ? img.closest('.ppk-forum, .ppk-cate')
      : null;
  
    if (!container) return false;
  
    return (
      container.classList.contains('cat_new') ||
      container.classList.contains('forum_new')
    );
  }    
    
  function updateThemeImages(theme, scope) {
    var map = THEME_IMAGE_MAP[theme] || THEME_IMAGE_MAP.dark;
    var root = scope || document;
  
    var images = root.querySelectorAll
      ? root.querySelectorAll(
          [
            'img[data-theme-image]',
            '.new-msg',
            '.last-post-icon img',
            '#pot-img a img',
            '.ppk-search-topic-lasticon img'
          ].join(', ')
        )
      : [];
  
    for (var i = 0; i < images.length; i++) {
      var img = images[i];
      var key = img.getAttribute('data-theme-image');
  
      if (!key) {
        if (img.classList && img.classList.contains('new-msg')) {
          if (!hasNewMessageState(img)) {
            img.style.display = 'none';
            continue;
          }
      
          img.style.display = '';
          key = 'newMsgIcon';
        } else if (
          (img.closest && img.closest('.last-post-icon')) ||
          (img.closest && img.closest('#pot-img')) ||
          (img.closest && img.closest('.ppk-search-topic-lasticon'))
        ) {
          key = 'lastPostIcon';
        }
      }
  
      var nextSrc = map[key];
  
      if (nextSrc && img.getAttribute('src') !== nextSrc) {
        img.setAttribute('src', nextSrc);
      }
    }
  }

  function syncSwitchUI(theme) {
    var switchEl = document.getElementById("themeSwitch");
    if (!switchEl) return;

    var buttons = switchEl.querySelectorAll(".theme-btn");
    var thumb = switchEl.querySelector(".theme-thumb");
    var activeIndex = 0;

    for (var i = 0; i < buttons.length; i++) {
      var isActive = buttons[i].getAttribute("data-theme") === theme;
      buttons[i].classList.toggle("active", isActive);
      buttons[i].setAttribute("aria-pressed", isActive ? "true" : "false");

      if (isActive) {
        activeIndex = i;
      }
    }

    if (thumb && buttons.length) {
      var btnWidth = buttons[0].offsetWidth || 0;
      thumb.style.transform = "translateX(" + (activeIndex * btnWidth) + "px)";
    }
  }

  function applyTheme(theme, persist) {
    if (!isValidTheme(theme)) {
      theme = "dark";
    }

    document.documentElement.setAttribute("data-color-scheme", theme);
    updateThemeImages(theme, document);
    syncSwitchUI(theme);

    if (persist) {
      saveTheme(theme);
    }
  }

  function bindSwitch() {
    var switchEl = document.getElementById("themeSwitch");
    if (!switchEl) return;
    if (switchEl.getAttribute("data-theme-bound") === "1") return;

    switchEl.setAttribute("data-theme-bound", "1");

    switchEl.addEventListener("click", function (e) {
      var button = closestThemeButton(e.target, switchEl);
      if (!button) return;

      var theme = button.getAttribute("data-theme");
      if (!isValidTheme(theme)) return;

      applyTheme(theme, true);
    });
  }

  function watchSystemTheme() {
    if (!window.matchMedia) return;

    var mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");

    function handleSystemChange() {
      if (!getSavedTheme()) {
        applyTheme(getSystemTheme(), false);
      }
    }

    if (mediaQuery.addEventListener) {
      mediaQuery.addEventListener("change", handleSystemChange);
    } else if (mediaQuery.addListener) {
      mediaQuery.addListener(handleSystemChange);
    }
  }

  function observeDynamicNodes() {
    if (!window.MutationObserver || !document.body) return;

    var observer = new MutationObserver(function (mutations) {
      var theme = getEffectiveTheme();
      var needsFullSync = false;

      for (var i = 0; i < mutations.length; i++) {
        var addedNodes = mutations[i].addedNodes;

        for (var j = 0; j < addedNodes.length; j++) {
          var node = addedNodes[j];
          if (!node || node.nodeType !== 1) continue;

          if (node.id === "themeSwitch" || (node.querySelector && node.querySelector("#themeSwitch"))) {
            needsFullSync = true;
          }

          if (
            (
              node.matches &&
              (
                node.matches('img[data-theme-image]') ||
                node.matches('.new-msg') ||
                node.matches('.last-post-icon img') ||
                node.matches('#pot-img a img') ||
                node.matches('.ppk-search-topic-lasticon img')
              )
            ) ||
            (
              node.querySelector &&
              node.querySelector(
                [
                  'img[data-theme-image]',
                  '.new-msg',
                  '.last-post-icon img',
                  '#pot-img a img',
                  '.ppk-search-topic-lasticon img'
                ].join(', ')
              )
            )
          ) {
            updateThemeImages(theme, document);
          }
        }
      }

      if (needsFullSync) {
        bindSwitch();
        syncSwitchUI(theme);
      }
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  }

  function initThemeManager() {
    bindSwitch();
    applyTheme(getEffectiveTheme(), false);
    watchSystemTheme();
    observeDynamicNodes();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initThemeManager);
  } else {
    initThemeManager();
  }

  window.addEventListener("load", function () {
    applyTheme(getEffectiveTheme(), false);
  });
})();
</script>

</body>
</html>
