  <!--
    Anti-flash : applique un thème avant le premier rendu, en attendant que
    guidebook.js prenne le relais (synchronisation avec le forum parent via
    postMessage notamment). Ordre de résolution (§41 du cahier technique) :
    thème sauvegardé → thème transmis en paramètre d'URL (?theme=) →
    préférence système → thème par défaut.
  -->
  <script>
    (function () {
      var STORAGE_KEY = "ppk-theme-preference";
      var LEGACY_KEY = "color-scheme";
      var VALID_THEMES = { dark: true, light: true, autumn: true, winter: true };
      var DEFAULT_THEME = "dark";

      function getSystemTheme() {
        return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }

      function getSavedTheme() {
        var saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) {
          var legacy = localStorage.getItem(LEGACY_KEY);
          if (VALID_THEMES[legacy]) {
            saved = legacy;
            localStorage.setItem(STORAGE_KEY, legacy);
          }
        }
        return VALID_THEMES[saved] ? saved : null;
      }

      function getUrlTheme() {
        try {
          var params = new URLSearchParams(window.location.search);
          var theme = params.get("theme");
          return VALID_THEMES[theme] ? theme : null;
        } catch (e) {
          return null;
        }
      }

      var theme = getSavedTheme() || getUrlTheme() || getSystemTheme() || DEFAULT_THEME;
      document.documentElement.setAttribute("data-color-scheme", theme);
    })();
  </script>
